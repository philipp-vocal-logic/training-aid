[project]
name = "training-aid"
version = "0.1.0"
description = "Simple KISS/YAGNI Workout Trainer web application for creating, motivating, and measuring training workouts"
authors = [
    { name = "Philipp Kaaden", email = "274027022+philipp-vocal-logic@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.5",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.33",
    "sqlmodel>=0.0.49",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
training-aid = "training_aid:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
