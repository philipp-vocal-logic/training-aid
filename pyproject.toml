[project]
name = "training-aid"
version = "0.1.0"
description = "Simple KISS/YAGNI Workout Trainer web application for creating, motivating, and measuring training workouts"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Philipp Kaaden", email = "274027022+philipp-vocal-logic@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
training-aid = "training_aid:main"
training-aid-check = "training_aid.audit:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
extend-select = ["N"]
ignore = [
    "COM812", # Conflicts with ruff format
    "ISC001", # Conflicts with ruff format
]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
    "classmethod",
    "pydantic.field_validator",
    "pydantic.model_validator",
]

[tool.ruff.lint.isort]
known-first-party = ["training_aid"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "S101"]

