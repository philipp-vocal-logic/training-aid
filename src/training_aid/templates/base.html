<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Train{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="/static/motion.js"></script>
  <script src="/static/sound.js"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block topbar %}
  <header class="topbar">
    <a href="/" class="brand-mark" aria-label="Home">
      <span class="brand-dot"></span>
      <span>TRAIN</span>
    </a>
    {% if current_user %}
    <nav class="nav-pills" aria-label="Primary">
      <a href="/" {% if active_nav == 'overview' %}aria-current="page"{% endif %}>Plan</a>
      <a href="/progress" {% if active_nav == 'progress' %}aria-current="page"{% endif %}>Stats</a>
      <a href="/setup" {% if active_nav == 'setup' %}aria-current="page"{% endif %}>Setup</a>
    </nav>
    {% endif %}
  </header>
  {% endblock %}

  {% block content %}{% endblock %}
</body>
</html>
