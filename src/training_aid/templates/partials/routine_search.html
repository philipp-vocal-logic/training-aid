{% if exercises %}
<div class="catalog-grid">
  {% for item in exercises %}
  <div class="catalog-card">
    <div class="ex-row-left">
      <img src="{{ item.svg_url }}" alt="" class="svg-thumb" />
      <div style="min-width: 0;">
        <div class="ex-row-name">{{ item.exercise.name }}</div>
        <div class="muted" style="font-size: 0.75rem; text-transform: capitalize;">{{ item.exercise.primary_muscle }}</div>
      </div>
    </div>
    <form action="/routines/{{ routine.id }}/add-exercise" method="post" style="margin: 0;">
      <input type="hidden" name="exercise_id" value="{{ item.exercise.id }}" />
      <button type="submit" class="btn-ghost" style="padding: 0.3rem 0.7rem;" aria-label="Add">+</button>
    </form>
  </div>
  {% endfor %}
</div>
{% else %}
<div class="muted">—</div>
{% endif %}
